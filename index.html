<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graphs Gallery</title>
</head>
<body>
<h1>Graphs Gallery</h1>

<label for="refreshInterval">Refresh every (seconds): </label>
<input type="number" id="refreshInterval" min="1" value="5" />
<button onclick="setRefresh()">Set Refresh Interval</button>

<p id="timestampDisplay"></p>

<div id="imagesContainer">
</div>

<!-- Configuration File, with Variables -->
<script src="configuration.js"></script>

<script>
let intervalId = null;

function generateImages() {
  const container = document.getElementById('imagesContainer');
  container.innerHTML = ''; // Clear previous images
  for (let i = 0; i < pngFiles.length; i++) {
    console.log(pngFiles[i]);
    const img = document.createElement('img');
    img.src = pngFiles[i];
    img.alt = 'Graph ' + (i + 1);
    img.width = 600; // or whatever size you prefer
    container.appendChild(img);
  }
}

function refreshPage() {
  console.log("Refreshing");
  // Reload the page
  location.reload();
}

function setRefresh() {
  const seconds = parseInt(document.getElementById('refreshInterval').value, 10);
  if (isNaN(seconds) || seconds < 1) {
    alert('Please enter a valid number greater than 0');
    return;
  }
  if (intervalId) {
    clearInterval(intervalId);
  }
  intervalId = setInterval(refreshPage, seconds * 1000);

  // Update the timestamp display
  const now = new Date();
  document.getElementById('timestampDisplay').textContent = 
    'Next refresh scheduled at: ' + now.toLocaleString();
}

// Set default refresh interval on page load
window.onload = function() {
  generateImages();
  setRefresh();
};
</script>
</body>
</html>
